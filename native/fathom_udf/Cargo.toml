[package]
name = "fathom_udf"
version = "0.1.0"
edition = "2021"
publish = false
description = "SQLite loadable extension supplying the user-defined functions Django's SQLite backend registers client-side"

[lib]
# `cdylib` is the loadable extension SQLite dlopen()s. `rlib` is ALSO built so the
# in-crate unit tests can link the pure logic directly — a cdylib alone cannot be
# unit-tested, and the Python-compatible formatting/parsing is exactly the part that
# needs table-driven tests against Django's own expectations.
crate-type = ["cdylib", "rlib"]
name = "fathom_udf"

[dependencies]
# `loadable_extension` makes libsqlite3-sys resolve SQLite symbols through the
# extension API pointer at load time instead of linking libsqlite3 — the host process
# (the BEAM, with exqlite's SQLite already loaded) provides them. Deliberately NOT
# `bundled`: a second copy of SQLite statically linked into the extension would be a
# different library than the one running the query.
# `hooks` adds Connection::wal_hook — the Phase 2 A2 frame seam (see src/wal.rs and
# docs/a2-quorum-replication.md). It is `hooks = []` upstream: a pure feature gate with no
# additional dependencies, so it costs nothing but the code it unlocks.
rusqlite = { version = "0.40", features = [
    "loadable_extension",
    "functions",
    "window",
    "hooks",
    # Connection::limit: REPEAT/LPAD/RPAD read the handle's SQLITE_LIMIT_LENGTH (src/lib.rs result_cap).
    "limits",
] }

# Bundled IANA timezone database. This is the whole reason #19 chose Rust: the six
# tz-dependent Django UDFs need real zone rules server-side, and chrono-tz compiles
# tzdata INTO the binary — no system /usr/share/zoneinfo dependency, so a slim
# distroless runner image and a macOS dev box behave identically.
chrono = { version = "0.4", default-features = false, features = ["std", "alloc"] }
chrono-tz = "0.10"

md-5 = "0.10"
sha1 = "0.10"
sha2 = "0.10"
# `fancy-regex`, not `regex`. Django's `__regex`/`__iregex` run through Python's `re`, which has
# lookaround and backreferences; the `regex` crate rejects both at compile time, so those lookups
# reached a tenant as an error where Django would have answered. fancy-regex layers a backtracking
# engine over `regex` and supports them.
fancy-regex = "0.19"
# Only to classify a pattern as plain vs backtracking (pyre::needs_backtracking); already in the tree.
regex-syntax = "0.8"
uuid = { version = "1", features = ["v4", "v7"] }
rand = "0.8"
# `dladdr` + `dlopen`, to pin this library in memory once it is registered as a process-global
# SQLite auto-extension (src/auto.rs, expert review 2026-10-22 r8 #14). Already in the tree.
libc = "0.2"

[dev-dependencies]
# Only for reading tests/oracle/cases.jsonl — the differential table generated from Django's own
# code. Deliberately a dev-dependency: nothing in the shipped extension parses JSON.
serde_json = "1"

[profile.release]
opt-level = 2
# `unwind`, not `abort` (expert review 2026-10-12 #1, decision Q1): this extension is loaded into
# the BEAM, so an abort on any missed panic path is a node-wide outage reachable by one tenant's
# SELECT. rusqlite wraps every scalar/aggregate/window callback in `catch_unwind` (functions.rs
# `call_boxed_closure`, `aggregate_step`, ...) and reports the panic to SQLite as an error
# (`Error::UnwindingPanic`), so with `unwind` a missed panic becomes a SQL error on that one
# statement instead of killing the VM. Every function body is still written to return an error
# rather than panic (checked arithmetic, see tests/fuzz.rs); this is the backstop. Allocation
# failure still aborts under either setting, which is why the text builders check their result
# size before allocating. Panics in the extern "C" hooks (wal, backstop, authorizer) still abort,
# as Rust does at any extern "C" boundary.
panic = "unwind"
