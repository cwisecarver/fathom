name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: mix test (OTP ${{ matrix.otp }})
    runs-on: ubuntu-latest
    env:
      MIX_ENV: test

    strategy:
      # Elixir stays at 1.20.1 (filo requires ~> 1.20); we vary OTP to catch VM-version issues.
      # fail-fast off so one OTP's result doesn't cancel the others.
      fail-fast: false
      matrix:
        otp: ["27", "28", "29"]

    services:
      postgres:
        image: postgres:16
        env:
          # config/test.exs connects to Fathom.Repo as "cwisecarver" with no password on
          # localhost, so stand up a matching superuser with trust auth (it CREATEs fathom_test).
          POSTGRES_USER: cwisecarver
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cwisecarver"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout fathom
        uses: actions/checkout@v4
        with:
          path: fathom

      # Fathom depends on Filo via a local path dep ({:filo, path: "../filo"}), so Filo must sit
      # next to it in the workspace ($WORKSPACE/filo == ../filo from $WORKSPACE/fathom). Filo is a
      # PRIVATE repo, so the default GITHUB_TOKEN (scoped to this repo) can't read it — provide a
      # token with read access to cwisecarver/filo in the FILO_ACCESS_TOKEN secret (a fine-grained
      # PAT with Contents: read on filo). CI pairs this branch against filo's main.
      - name: Checkout filo (path dependency)
        uses: actions/checkout@v4
        with:
          repository: cwisecarver/filo
          ref: main
          token: ${{ secrets.FILO_ACCESS_TOKEN }}
          path: filo

      - name: Set up Elixir/OTP
        uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.20.1"
          otp-version: ${{ matrix.otp }}

      - name: Cache deps and _build
        uses: actions/cache@v4
        with:
          # _build artifacts are OTP-specific, so key the cache on the OTP version too.
          path: |
            fathom/deps
            fathom/_build
          key: ${{ runner.os }}-otp${{ matrix.otp }}-mix-${{ hashFiles('fathom/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-otp${{ matrix.otp }}-mix-

      - name: Install dependencies
        working-directory: fathom
        run: mix deps.get

      - name: Check formatting
        working-directory: fathom
        run: mix format --check-formatted

      # exqlite / lazy_html compile a C NIF (gnu toolchain is preinstalled); ecto_libsql pulls a
      # precompiled Rust NIF via rustler_precompiled (no Rust toolchain needed).
      - name: Compile (warnings as errors)
        working-directory: fathom
        run: mix compile --warnings-as-errors

      # The `mix test` alias creates + migrates the test Postgres DB, then runs the suite. :s3
      # (live MinIO) and :bench tests are excluded by test/test_helper.exs.
      - name: Run tests
        working-directory: fathom
        run: mix test
