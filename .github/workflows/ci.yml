name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Manual lever. Added 2026-08-11 because `pull_request` runs silently stopped firing for PR #1:
  # the push landed, the PR head updated, and GitHub created NO run — `gh pr checks` reported none
  # and the runs API returned 0 for that SHA. Close/reopen did not help and neither did another
  # push, so nine commits of A2 work (including a WIRE FORMAT change) had never been through CI
  # while the branch looked healthy.
  #
  # `workflow_dispatch` must live on the DEFAULT branch to be dispatchable, and it can then target
  # any ref: `gh workflow run CI --ref <branch>`. That is the recovery path when the event-driven
  # triggers go quiet — which is a failure mode with no symptom other than an absence.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: mix test (OTP ${{ matrix.otp }})
    runs-on: ubuntu-latest
    env:
      MIX_ENV: test
      # config/test.exs: PGUSER || USER || "postgres". Pin it so the suite doesn't depend
      # on the runner's OS user matching the Postgres role.
      PGUSER: postgres
      PGHOST: localhost

    strategy:
      # Elixir stays at 1.20.1 (filo requires ~> 1.20); we vary OTP to catch VM-version issues.
      # fail-fast off so one OTP's result doesn't cancel the others.
      fail-fast: false
      matrix:
        otp: ["27", "28", "29"]

    services:
      postgres:
        image: postgres:16
        env:
          # config/test.exs resolves the role as PGUSER || USER || "postgres". On a runner
          # USER is "runner", so this used to hardcode a developer's local username here to
          # make them match -- which broke the moment CI ran anywhere else. Instead: a
          # conventional "postgres" role, and PGUSER pinned in the job env below so the
          # resolution is deterministic rather than dependent on who the runner is.
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      # Filo comes from Hex as of fathom 0.3.0, so this is a plain single-repo checkout.
      # It used to check fathom out into a fathom/ subdirectory and clone the PRIVATE filo
      # repo alongside it (via a FILO_ACCESS_TOKEN PAT) to satisfy a `path: "../filo"` dep.
      # None of that is needed now — the secret can be deleted from the repo settings.
      - uses: actions/checkout@v4

      - name: Set up Elixir/OTP
        uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.20.1"
          otp-version: ${{ matrix.otp }}

      - name: Cache deps and _build
        uses: actions/cache@v4
        with:
          # _build artifacts are OTP-specific, so key the cache on the OTP version too.
          path: |
            deps
            _build
          key: ${{ runner.os }}-otp${{ matrix.otp }}-mix-${{ hashFiles('mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-otp${{ matrix.otp }}-mix-

      # native/fathom_udf — the loadable SQLite extension supplying Django's UDFs (expert review
      # 2026-08-01 #19). Rust is preinstalled on ubuntu-latest; this only caches the build.
      # `mix compile.fathom_udf` SKIPS when cargo is absent rather than failing, so WITHOUT this
      # cache-and-verify the Django compat suite would quietly test nothing.
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            native/fathom_udf/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('native/fathom_udf/Cargo.toml') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Install dependencies
        run: mix deps.get

      - name: Check formatting
        run: mix format --check-formatted

      # The Rust unit tests plus the differential oracle: 12.5k cases whose expectations were
      # generated by running Django's own _sqlite_* functions. Run BEFORE the Elixir suite so a
      # value-level disagreement with Django reports as itself rather than as a failing queryset.
      - name: Test the Django-compat extension (Rust)
        run: cargo test --manifest-path native/fathom_udf/Cargo.toml

      # exqlite / lazy_html compile a C NIF; the gnu toolchain is preinstalled on the runner.
      - name: Compile (warnings as errors)
        run: mix compile --warnings-as-errors

      # The typing gate, same one `mix precommit` runs. Keyed on mix.lock AND the OTP version
      # because a PLT is specific to both; a miss costs ~10-20 min to rebuild, a hit ~2 s to check.
      - name: Cache dialyzer PLTs
        uses: actions/cache@v4
        with:
          path: priv/plts
          key: ${{ runner.os }}-otp${{ matrix.otp }}-plt-${{ hashFiles('mix.lock') }}
          restore-keys: ${{ runner.os }}-otp${{ matrix.otp }}-plt-

      # MIX_ENV=dev is the SCOPE, not a detail: :test also compiles test/support, whose benchmark
      # drivers re-introduce the mint_web_socket opaque-type cascade documented in mix.exs. This
      # analyzes lib/ only, exactly as the precommit step does.
      #
      # Runs in the matrix so a typing difference between OTP 27/28/29 surfaces here rather than on
      # someone's machine — precommit only ever exercises whichever OTP the developer has.
      - name: Dialyzer (typing gate)
        env:
          MIX_ENV: dev
        run: mix dialyzer

      # The `mix test` alias creates + migrates the test Postgres DB, then runs the suite. :s3
      # (live MinIO) and :bench tests are excluded by test/test_helper.exs.
      #
      # :wal_probe is included HERE rather than left to a developer's shell, because it is the only
      # proof that the Phase 2 A2 frame seam (sqlite3_wal_hook via the loadable extension) actually
      # fires — and it cannot run under a plain `mix test`: the extension reads FATHOM_WAL_PROBE
      # from the OS environment, and `System.put_env` cannot set that for native code (it updates
      # the BEAM's own table, not C `environ`). Without this line the test would be permanently
      # skipped, which is the same as deleting it.
      - name: Run tests
        env:
          FATHOM_WAL_PROBE: "1"
        run: mix test --include wal_probe

      # THE FAILURE LOG IS THE ONLY EVIDENCE A CI-ONLY FLAKE EVER LEAVES, and without this step it
      # was thrown away with the runner.
      #
      # `Fathom.FailureCaptureFormatter` already writes `logs/test-failures-<ts>.log` with the SEED,
      # the failing location and a paste-ready rerun command (nothing at all on a green run). What
      # GitHub's own log gives instead is the annotation — the test NAME and its `test` line, not the
      # assertion that failed and not the seed. That is the gap this closes: on 2026-08-23 three
      # different A2 replication tests went red across two runs and none of them could be attributed,
      # because the annotation named the test and the job log needed repository ADMIN to download
      # (`gh run view --log-failed` → HTTP 403 for a non-admin, on a PUBLIC repo).
      #
      # `if: failure()` so a green run uploads nothing, and `continue-on-error` so a missing file
      # (e.g. the job died before ExUnit started) can never turn a real failure into a confusing
      # second one.
      - name: Capture the test failure log
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: test-failures-otp${{ matrix.otp }}
          path: logs/test-failures-*.log
          if-no-files-found: ignore
          retention-days: 30

      # The :s3 suite — the live-store contract, and until now the one thing NOTHING ran.
      #
      # It is excluded from `mix test` by design (it needs a real store), so it was excluded
      # everywhere: not in the default suite, not in CI, not in `mix precommit`. It duly rotted —
      # on 2026-08-12 `pull on a missing object` was still asserting the `{:ok, _}` contract that
      # expert review 2026-08-01 #24 had deliberately replaced with `{:absent, _}` eleven days
      # earlier, and nobody could have known. This is the suite an operator reaches for during an
      # incident; it is the worst one to discover is stale.
      #
      # It runs `scripts/minio_test.sh` rather than a hand-written CI-only sequence, so the thing
      # CI proves and the thing a developer runs locally cannot drift apart. That script starts
      # MinIO, creates the bucket, runs the suite and tears down. It is NOT a `services:` container
      # because `minio/minio` needs the `server /data` subcommand and service containers cannot
      # override a command.
      #
      # In the matrix, so the S3 backend is covered on all three OTP versions — it is ~24 fast
      # tests, and the conditional-write fence it proves is the load-bearing part of the
      # single-writer design.
      - name: Run the :s3 suite against MinIO
        # `shell: bash` is load-bearing, not decoration. GitHub's DEFAULT run shell is `bash -e`
        # WITHOUT pipefail; naming bash explicitly gets `bash --noprofile --norc -eo pipefail`.
        # Without it, `minio_test.sh | tee` returns TEE's status, so a suite that failed every
        # single test would report success — the step would exist purely to look green.
        shell: bash
        run: |
          scripts/minio_test.sh 2>&1 | tee /tmp/s3-suite.log

          # ANTI-ROT GUARD, and the actual point of this step.
          #
          # A green ":s3" step that ran ZERO tests is exactly the state this whole job exists to
          # end, and it is reachable without anyone noticing: rename the file, change the tag,
          # mistype the path in the script. `mix test` exits 0 having run nothing, and the step
          # passes forever while proving nothing.
          #
          # The floor is deliberately well under the current count (24) — it is here to catch
          # "ran nothing", not to pin a number that legitimate churn would break.
          ran=$(grep -oE '^Result: [0-9]+ passed' /tmp/s3-suite.log | grep -oE '[0-9]+' | tail -1)
          if [ -z "$ran" ]; then
            # Fall back to ExUnit's older summary shape, so an Elixir upgrade that changes the
            # wording degrades to a missed guard rather than a false failure.
            ran=$(grep -oE '[0-9]+ tests?, [0-9]+ failure' /tmp/s3-suite.log | grep -oE '^[0-9]+' | tail -1)
          fi

          if [ "${ran:-0}" -lt 15 ]; then
            echo "::error::the :s3 suite reported ${ran:-no} tests — it ran (almost) nothing."
            echo "A passing step that executes no tests is how this suite went stale for eleven"
            echo "days. Check the --include tag and the file path in scripts/minio_test.sh."
            exit 1
          fi
          echo ":s3 suite ran $ran tests against a live MinIO."
