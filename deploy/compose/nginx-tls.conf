# Fathom eval-stack LB — TLS-terminating variant of nginx.conf.
#
# Same single-node eval semantics as nginx.conf (hash-on-Host, Host preserved end to end,
# WS upgrade, long-lived stream timeouts) but TLS terminates HERE, matching the production
# posture (deploy/lb/fathom.nginx.conf + docs/auth.md): fathom still speaks PLAIN HTTP on
# :8080 (Hrana) and :4000 (control plane) behind the LB — the trust boundary is the LB, so
# the backend ports must be reachable only through it. Two listeners:
#
#   :8443  wss   -> the Hrana data plane (per-shard tokens stop riding plaintext ws://)
#   :4443  https -> the admin/control-plane API on :4000 (token minting + BasicAuth over TLS)
#
# Certs are mounted at /etc/nginx/certs (a `*.<zone>` wildcard + its key). The djathom demo
# stack (djathom/deploy) generates a throwaway CA + wildcard at compose-up; for real certs
# and the multi-node fleet config see deploy/lb/fathom.nginx.conf.

worker_processes auto;
events { worker_connections 1024; }

http {
  map $http_upgrade $connection_upgrade { default upgrade; '' close; }

  upstream fathom_hrana {
    hash $host consistent;
    server fathom:8080 max_fails=2 fail_timeout=10s;
    keepalive 32;
  }

  upstream fathom_api {
    server fathom:4000;
    keepalive 8;
  }

  # ---- Hrana data plane (wss) --------------------------------------------------------
  server {
    listen 8443 ssl;
    server_name _;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    location / {
      proxy_pass http://fathom_hrana;

      # CRITICAL: preserve Host — it's the shard key AND the hash key.
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;

      # WebSocket (django-libsql).
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;

      # Long-lived Hrana streams.
      proxy_read_timeout  3600s;
      proxy_send_timeout  3600s;
      proxy_connect_timeout 2s;
    }
  }

  # ---- Control-plane / admin API (https) ---------------------------------------------
  # NOT shard-routed: the :api pipeline is `plug :accepts, ["json"]` only (no CSRF, no host
  # check), so proxying it under any *.<zone> name is safe. Token minting + admin BasicAuth
  # now ride TLS instead of plaintext http://fathom:4000.
  server {
    listen 4443 ssl;
    server_name _;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    location / {
      proxy_pass http://fathom_api;

      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;

      proxy_http_version 1.1;
      proxy_read_timeout    60s;
      proxy_connect_timeout 2s;
    }
  }
}
