# Fathom eval-stack LB (review #17) — single-node, plaintext, localhost.
#
# Mirrors the production LB semantics (hash-on-Host, Host preserved end-to-end, WS upgrade,
# long-lived stream timeouts) but for one backend over plain HTTP on :8080. The Host header is BOTH
# the shard key (acme.localhost -> shard "acme") AND must be preserved — do not rewrite it. For the
# real multi-node, TLS-terminating config see deploy/lb/fathom.nginx.conf + docs/deploy-cluster.md.

worker_processes auto;
events { worker_connections 1024; }

http {
  map $http_upgrade $connection_upgrade { default upgrade; '' close; }

  upstream fathom_hrana {
    hash $host consistent;
    server fathom:8080 max_fails=2 fail_timeout=10s;
    keepalive 32;
  }

  server {
    listen 8080;
    server_name _;

    location / {
      proxy_pass http://fathom_hrana;

      # CRITICAL: preserve Host — it's the shard key AND the hash key.
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;

      # WebSocket (django-libsql).
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;

      # Long-lived Hrana streams.
      proxy_read_timeout  3600s;
      proxy_send_timeout  3600s;
      proxy_connect_timeout 2s;
    }
  }
}
