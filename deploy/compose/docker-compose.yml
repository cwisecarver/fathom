# Fathom single-node EVAL stack (review #17) — fathom + MinIO + Postgres + nginx, safe defaults.
#
# The "zero to serving a tenant" on-ramp: one `docker compose up` gives a complete fathom you can
# provision a tenant on and connect a libSQL client (or django-libsql) to. See README.md for the
# <30-minute walkthrough and docs/quickstart-django.md for the Django side.
#
# This is an EVALUATION stack, not production:
#   - The dashboard/API run over plain HTTP on localhost (WEB_INSECURE_LOCAL build arg).
#   - MinIO stands in for S3/R2/Tigris; Postgres + MinIO hold no durable volume unless you add one.
#   - Secrets below are DEV PLACEHOLDERS. For anything reachable beyond localhost, read
#     docs/configuration.md and set real SECRET_KEY_BASE / ADMIN_PASS / S3 creds, turn on
#     HRANA_AUTH, and build WITHOUT WEB_INSECURE_LOCAL. Never expose this stack as-is.

name: fathom-eval

x-fathom-env: &fathom-env
  DATABASE_URL: ecto://postgres:postgres@postgres/fathom
  # DEV PLACEHOLDER — generate your own with `mix phx.gen.secret` (or `openssl rand -base64 48`).
  SECRET_KEY_BASE: eval0nlyeval0nlyeval0nlyeval0nlyeval0nlyeval0nlyeval0nlyeval0nly1234
  RELEASE_COOKIE: fathom-eval-cookie
  PHX_SERVER: "1"
  PHX_HOST: localhost
  # Anchor Host-subdomain routing to this zone: only <shard>.localhost selects a shard.
  SHARD_BASE_DOMAIN: localhost
  # Storage: MinIO (S3-compatible). Swap for real S3/R2/Tigris by changing these five.
  SHARD_STORAGE: s3
  S3_BUCKET: fathom-shards
  S3_ENDPOINT: http://minio:9000
  S3_PATH_STYLE: "true"
  # MinIO does not implement conditional DELETE (a stale-etag If-Match DELETE answers 204, not 412),
  # so the boot fence self-test refuses it. This opts out, as deploy/chaos does. The lock-release
  # fence it protects matters when two nodes contend for a shard; this stack has one. Leave it
  # UNSET on real S3.
  SHARD_STORAGE_ALLOW_WEAK_CONDITIONAL_DELETE: "true"
  AWS_ACCESS_KEY_ID: fathom
  AWS_SECRET_ACCESS_KEY: fathom-secret
  SHARD_DATA_DIR: /data/shards
  # Admin dashboard + control-plane API (/api/tenants) BasicAuth. CHANGE THE PASSWORD. Prod boot
  # refuses a password under 16 bytes (expert review 2026-10-13 #9), so this default must stay 16+.
  ADMIN_USER: admin
  ADMIN_PASS: eval-stack-admin-pass
  # Prod boot refuses the shared throttle bucket unless TRUSTED_PROXIES is set (expert review
  # 2026-10-12 #12). This stack has no proxy in front of :4000, so the opt-out is correct here.
  ADMIN_THROTTLE_SHARED_BUCKET_OK: "true"
  # Eval convenience: reach the plaintext dashboard/API on localhost:4000. Paired with the
  # WEB_INSECURE_LOCAL build arg below (SSL forcing off). Never in a real deployment.
  WEB_INSECURE_LOCAL: "1"
  # Prod REQUIRES HRANA_AUTH to be set explicitly (either value). This eval stack says `disabled`
  # (the network is the trust boundary). To require per-shard tokens, set HRANA_AUTH=required and
  # mint tokens with `bin/fathom eval 'Fathom.HranaAuth.token_for(...)'` or the
  # /api/tenants/:id/token endpoint. See docs/auth.md.
  HRANA_AUTH: disabled
  # Prod turns A2 quorum replication ON by default, and a prod node with it on refuses to boot
  # without REPLICATION_FOLLOWERS, REPLICATION_BIND_IP and a frame-auth key. A single node has no
  # followers to ship to, so this stack turns off all four replication switches: shipping, the
  # follower listener, and frame signing / requiring (which would otherwise need a key).
  # See docs/a2-quorum-replication.md for a fleet.
  REPLICATION_ENABLED: "false"
  REPLICATION_LISTEN: "false"
  REPLICATION_SIGN_FRAMES: "false"
  REPLICATION_HMAC_REQUIRED: "false"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: fathom
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 2s
      retries: 30

  # minio/minio and minio/mc are gone from Docker Hub, so this uses Chainguard's MinIO image (as
  # deploy/chaos does). It has no curl and no web console; the health check speaks HTTP over bash's
  # /dev/tcp, and minio-init reuses the same image, which ships mc.
  minio:
    image: ${FATHOM_MINIO_IMAGE:-cgr.dev/chainguard/minio:latest}
    command: server /data
    environment:
      MINIO_ROOT_USER: fathom
      MINIO_ROOT_PASSWORD: fathom-secret
    healthcheck:
      test:
        - CMD
        - bash
        - -c
        - 'exec 3<>/dev/tcp/127.0.0.1/9000 && printf "GET /minio/health/live HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n" >&3 && read -r status <&3 && [[ $$status == *" 200 "* ]]'
      interval: 2s
      timeout: 2s
      retries: 30

  minio-init:
    image: ${FATHOM_MINIO_IMAGE:-cgr.dev/chainguard/minio:latest}
    depends_on:
      minio:
        condition: service_healthy
    environment:
      # The image runs as uid 65532 with no writable home; give mc a config dir it can write.
      MC_CONFIG_DIR: /tmp/.mc
    entrypoint: >
      bash -c "mc alias set local http://minio:9000 fathom fathom-secret &&
                  mc mb -p local/fathom-shards"

  migrate:
    image: fathom:eval
    build: &fathom-build
      # The parent of BOTH repos (fathom + the ../filo path dep), relative to this file.
      context: ../../..
      dockerfile: fathom/deploy/compose/Dockerfile
      args:
        WEB_INSECURE_LOCAL: "1"
    command: ["/app/bin/fathom", "eval", "Fathom.Release.migrate"]
    environment:
      <<: *fathom-env
      SHARD_STORAGE: local # no storage/fence needed to run Ecto migrations
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  fathom:
    # Built once, by `migrate`. Giving this service its own `build:` made compose build the same
    # tag twice in parallel, and the second export failed: image "fathom:eval" already exists.
    image: fathom:eval
    pull_policy: never
    environment: *fathom-env
    ports:
      - "4000:4000" # admin dashboard + control-plane API (BasicAuth)
    depends_on:
      migrate:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8081/health"]
      interval: 5s
      timeout: 3s
      retries: 12

  lb:
    image: nginx:1.27-alpine
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "8080:8080" # the Hrana endpoint clients connect to (libsql://<shard>.localhost:8080)
    depends_on:
      fathom:
        condition: service_healthy
