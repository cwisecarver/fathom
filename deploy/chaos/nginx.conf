# Chaos-rig variant of deploy/lb/fathom.nginx.conf: same partition mechanism
# (hash $host consistent + passive health + in-request failover), plain HTTP on
# :80, container-name upstreams. Timeouts mirror the prod config on purpose —
# the frozen-node hang (passive health can't see a paused-but-listening node)
# is one of the behaviors the rig exists to demonstrate.

worker_processes auto;

events { worker_connections 16384; }  # each proxied request uses TWO (downstream + upstream), so 4096 capped a worker near 2048 concurrent (review #7)

http {

  # Client-facing compression, done ONCE here rather than per-response in Bandit (review #16).
  # fathom's Hrana listener runs with `compress: false`: compressing kilobyte JSON on every
  # response is init-dominated zlib work for a hop that is usually a datacenter LAN, and Bandit has
  # no size threshold. nginx does, so tiny pipeline replies skip it entirely while the WAN hop
  # still gets compressed. Wire-transparent: the client still receives `content-encoding: gzip`.
  gzip on;
  gzip_types application/json;
  gzip_min_length 1000;
  gzip_proxied any;
  gzip_vary on;
  # `'' ""` (not `'' close`): an empty Connection header is REMOVED, which upstream
  # keepalive requires — `'' close` made Bandit close every conn after one response,
  # so the pool recycled constantly and nginx raced the backend FIN under load (the
  # 502 storms; root-caused 2026-07-23, see deploy/lb/fathom.nginx.conf).
  map $http_upgrade $connection_upgrade { default upgrade; '' ""; }

  upstream fathom_hrana {
    hash $host consistent;

    # Five nodes: the minimum that can hold one shard's A2 replica set (1 primary +
    # 4 followers, ack at 2-of-4). `consistent` means growing 3 → 5 remaps only ~2/5
    # of the subdomains rather than nearly all of them.
    server fathom1:8080 max_fails=2 fail_timeout=10s;
    server fathom2:8080 max_fails=2 fail_timeout=10s;
    server fathom3:8080 max_fails=2 fail_timeout=10s;
    server fathom4:8080 max_fails=2 fail_timeout=10s;
    server fathom5:8080 max_fails=2 fail_timeout=10s;

    # Per-worker idle-connection cache; past it nginx closes the LRU connection (review #7).
    # Kept in step with deploy/lb/fathom.nginx.conf and LbMap's pin-upstream template.
    keepalive 512;
    # nginx must close idle pooled conns before Bandit's 60s idle close does.
    keepalive_timeout 30s;
    # Default 1000 recycles a pooled conn ~once a minute at measured rates, re-opening the FIN
    # race that keepalive_timeout closed for the idle case.
    keepalive_requests 100000;
  }

  # The Phase-2 B1 exception table (Fathom.Rebalancer.LbMap): defines
  # `map $host $fathom_target { default fathom_hrana; <hot-host> fathom_pin_<node>; }`
  # plus a pin-upstream per node. The rebalancer rewrites this file when it pins a shard;
  # the `lb-reloader` sidecar HUPs nginx to apply it — so a handoff needs no host bridge.
  # The hot minority is pinned; everything else stays `default fathom_hrana` (the
  # consistent-hash pool above).
  include /etc/nginx/lb/exceptions.conf;

  server {
    listen 80 default_server;
    server_name *.fathom.test;

    # Server scope, so the cursor location below inherits all of it instead of duplicating it
    # (locations inherit from `server`, never from a sibling location). Keep in step with
    # deploy/lb/fathom.nginx.conf.

    # The Host header is BOTH the shard selector and the hash key — never rewrite it.
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    proxy_read_timeout  3600s;
    proxy_send_timeout  3600s;
    proxy_connect_timeout 2s;

    proxy_next_upstream error timeout http_502 http_503 http_504;
    proxy_next_upstream_tries 3;

    # Never spool a large cursor response to LB disk (review 2026-07-24 #36). See the long
    # rationale in deploy/lb/fathom.nginx.conf; buffers match filo's ~32 KiB chunk size.
    location ~ ^/v3(-protobuf)?/cursor$ {
      proxy_pass http://$fathom_target;
      proxy_buffers 16 32k;
      proxy_max_temp_file_size 0;
    }

    location / {
      # Route to the pin-upstream for a pinned subdomain, else the hash pool ($fathom_target
      # defaults to fathom_hrana). A variable proxy_pass, so a map reload re-routes live.
      proxy_pass http://$fathom_target;
    }
  }
}
