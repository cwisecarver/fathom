# Fathom chaos rig: 5 independent fathom nodes behind an nginx L7 LB
# (hash-on-Host), sharing one MinIO bucket (the S3 lease store + bottomless
# backend) through per-node toxiproxy proxies (fault injection: latency,
# bandwidth, partition) and one Postgres (the directory / control plane).
#
# WHY FIVE and not three: Phase-2 A2 adopts Project Waterpark's quorum-replication
# shape — 1 primary + 4 read-only followers per shard, acking at 2-of-4 — so FIVE
# nodes is the MINIMUM that can hold a single shard's replica set. A 3-node rig can
# no longer exercise the target topology at all (it cannot even place the followers),
# and a scenario that silently ran on a 3-of-5 stand-in would report a quorum result
# for a quorum that never existed. See docs/a2-quorum-replication.md.
# Everything else about the rig is unchanged: the extra two nodes are ordinary peers
# (same image, same env, their own toxiproxy S3 path and their own port block).
#
#   driver: ./chaos.sh   docs: README.md + docs/deploy-cluster.md "Chaos testing"
#
# All numbers this rig produces are RELATIVE (shared host disk/CPU, loopback
# MinIO) — inject S3 latency (chaos.sh latency 30) before timing anything.

name: fathom-chaos

x-fathom-env: &fathom-env
  DATABASE_URL: ecto://postgres:postgres@postgres/fathom_chaos
  # Rig-only secret; rotate for anything reachable beyond localhost.
  SECRET_KEY_BASE: FRuJDVYlmnTBTuLbaH2npKe5RmB3rk4cvHKAHNvA31Gzp5m0z7JnkG8OwLbAGz9j
  RELEASE_COOKIE: fathom-chaos-cookie
  PHX_HOST: fathom.test
  SHARD_BASE_DOMAIN: fathom.test
  SHARD_STORAGE: s3
  S3_BUCKET: fathom-shards
  S3_PATH_STYLE: "true"
  AWS_ACCESS_KEY_ID: fathom
  AWS_SECRET_ACCESS_KEY: fathom-secret
  SHARD_DATA_DIR: /data/shards
  # Short TTL so failover experiments iterate quickly; the TTL is the
  # failover-stall ceiling (a dead node's shards stay unstealable up to this long).
  SHARD_LEASE_TTL_MS: "10000"
  # Fast flush cadence so scenarios observe durability PUTs within seconds, and a
  # short idle threshold so flush-and-drop happens inside a scenario's window.
  SHARD_FLUSH_INTERVAL_MS: "5000"
  SHARD_IDLE_MS: "20000"
  # Per-shard load counters on, so `chaos.sh hotspots` can read Fathom.ShardLoad.top
  # per node — the real-traffic hot-spot measurement (Phase-2 §B).
  SHARD_LOAD: "true"
  # Every node is also a warm-standby follower, so kill-failover exercises the
  # warm-promotion (304) path when the survivor has the shard cached.
  WARM_FOLLOWER: "true"
  WARM_CACHE_DIR: /data/warm
  WARM_POLL_MS: "2000"
  # Phase-2 A2 quorum replication. LISTENING IS ON EVERYWHERE, SHIPPING IS NOT — that is the
  # documented rollout order (docs/configuration.md), and the rig should demonstrate the order it
  # tells operators to use. A shipper whose followers are not listening 503s every tenant write.
  #
  # Until 2026-08-10 the rig had no replication env at all, so A2 had never run multi-node outside
  # a single BEAM despite fathom4/fathom5 having been added specifically to hold a full replica set.
  REPLICATION_LISTEN: "true"
  REPLICATION_LISTEN_PORT: "9100"
  REPLICATION_DIR: /data/replicas
  # REPLICATION_BIND_IP is deliberately unset: inside the compose network there is no public
  # interface to hide from, and each node's IP is assigned at runtime. Expect the boot line to name
  # 0.0.0.0 and say so — that warning firing IS the check that the knob is wired.
  #
  # Shipping is per-scenario: empty by default so the rig runs exactly as before, and flipped for
  # a run with `REPLICATION_ENABLED=true ./chaos.sh replication`. REPLICATION_FOLLOWERS is set
  # PER NODE below (each node's four peers, never itself) — a shared list would have every node
  # shipping its own shards to its own listener, which works but muddies every result.
  REPLICATION_ENABLED: "${REPLICATION_ENABLED:-}"
  REPLICATION_QUORUM: "${REPLICATION_QUORUM:-2}"
  # Phase-2 B1 dynamic rebalancing: every node reports its load, acts on handoff
  # commands, and runs the (singleton) control loop; the LB backend set + where the
  # rendered exception map is written. NODE_KEY is per-node (set on each service below).
  LOAD_REPORTER: "true"
  COMMAND_POLLER: "true"
  REBALANCER_ENABLED: "true"
  LB_BACKENDS: "fathom1=fathom1:8080,fathom2=fathom2:8080,fathom3=fathom3:8080,fathom4=fathom4:8080,fathom5=fathom5:8080"
  LB_MAP_PATH: /etc/nginx/lb/exceptions.conf
  # Fast, deterministic demo: report every 3s, confirm a hotspot over 2 windows, short
  # cooldown, and an absolute q/s floor tuned to the rig's per-shard rates.
  LOAD_REPORT_INTERVAL_MS: "3000"
  REBALANCE_CONFIRM_WINDOWS: "2"
  REBALANCE_COOLDOWN_MS: "15000"
  REBALANCE_HOT_QPS_FLOOR: "10.0"
  # Serve the Phoenix endpoint (:4000) + BasicAuth so each node's live admin dashboard is
  # watchable during scenarios (published per-node as 4001..4005 below → 192.168.x:400N).
  # WEB_INSECURE_LOCAL turns off the prod SSL-force + WS origin check so a browser on the LAN can
  # reach the plaintext dashboard (rig-only; never in a real deployment).
  # A/B hook. ERTS reads ERL_ZFLAGS *after* the release's vm.args, so a flag set here wins — which
  # lets a sweep flip ONE VM knob on the same binary with no rebuild:
  #   ERL_ZFLAGS="+SDio 10" ./chaos.sh up && ./chaos.sh tpc-fleet 1024
  # Unset ⇒ empty ⇒ rel/vm.args.eex stands unmodified.
  ERL_ZFLAGS: "${ERL_ZFLAGS:-}"
  # Same idea for the accept-queue A/B (#6). The pre-fix shape is 1 socket + ThousandIsland's
  # default 1024 backlog; the fix is 4 sockets (reuseport) + 4096. Each half sweeps independently.
  HRANA_LISTEN_SOCKETS: "${HRANA_LISTEN_SOCKETS:-4}"
  HRANA_BACKLOG: "${HRANA_BACKLOG:-4096}"
  # #40's A/B seam: Bandit's forced connection-process GC interval.
  HRANA_GC_EVERY_N: "${HRANA_GC_EVERY_N:-5}"
  PHX_SERVER: "1"
  ADMIN_USER: admin
  ADMIN_PASS: admin
  WEB_INSECURE_LOCAL: "1"

x-fathom-node: &fathom-node
  image: fathom-chaos:latest
  restart: "no" # the rig kills nodes on purpose; auto-restart would fight the scenarios
  # Served density (a live connection per shard) is fd-bound: the default 1024 soft limit
  # caps a node at ~940 held connections. Real deployments provision fds; raise it here so
  # the `chaos.sh density --served` run can hold ~10k/node (see docs/reviews/fleet-density).
  ulimits:
    nofile:
      soft: 65536
      hard: 524288
  # The rebalancer renders the LB exception map here; nginx includes the same host dir.
  volumes:
    - ./lb-runtime:/etc/nginx/lb
  depends_on:
    migrate:
      condition: service_completed_successfully
    minio-init:
      condition: service_completed_successfully
    toxiproxy:
      condition: service_started
  healthcheck:
    test: ["CMD", "curl", "-sf", "http://localhost:8081/health"]
    interval: 5s
    timeout: 3s
    retries: 12

services:
  postgres:
    image: postgres:16-alpine
    # max_connections=300, because the default 100 cannot serve this rig and has not been able to
    # since it went 3 -> 5 nodes on 2026-08-08 (for A2's replica set). Each node opens POOL_SIZE
    # Repo connections, default 25 (config/runtime.exs), plus Oban's notifier/peer/queues:
    # 3 x 25 = 75 fit under 100, 5 x 25 = 125 do not.
    #
    # The symptom is NOT a clear "out of connections" at the edge — writes just fail, and the node
    # logs fill with Oban.Peer/Stager crashes and warm-follower directory-read timeouts, all of
    # which read like application bugs. `smoke` failed identically with replication on and off,
    # which is what identified it as infrastructure.
    #
    # Raised rather than lowering POOL_SIZE per node: the pool size is what a production node
    # actually runs, and shrinking it would make every throughput scenario measure a topology
    # nobody deploys.
    command: ["postgres", "-c", "max_connections=300"]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: fathom_chaos
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 2s
      retries: 30

  minio:
    image: minio/minio:latest
    command: server /data
    environment:
      MINIO_ROOT_USER: fathom
      MINIO_ROOT_PASSWORD: fathom-secret
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:9000/minio/health/live"]
      interval: 2s
      timeout: 2s
      retries: 30

  minio-init:
    image: minio/mc
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "mc alias set local http://minio:9000 fathom fathom-secret &&
                  mc mb -p local/fathom-shards"

  toxiproxy:
    image: ghcr.io/shopify/toxiproxy:2.12.0
    command: ["-host=0.0.0.0", "-config=/etc/toxiproxy.json"]
    volumes:
      - ./toxiproxy.json:/etc/toxiproxy.json:ro
    ports:
      - "8474:8474" # control API, used by chaos.sh

  migrate:
    image: fathom-chaos:latest
    build:
      # The parent of BOTH repos (fathom + the ../filo path dep), relative to this file.
      context: ../../..
      dockerfile: fathom/deploy/chaos/Dockerfile
    command: ["/app/bin/fathom", "eval", "Fathom.Release.migrate"]
    environment:
      <<: *fathom-env
      # No storage/heartbeat needed to run Ecto migrations, and the fence probe
      # would race minio-init; plain local defaults for this one-shot.
      SHARD_STORAGE: local
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  fathom1:
    <<: *fathom-node
    environment:
      <<: *fathom-env
      S3_ENDPOINT: http://toxiproxy:21001
      NODE_KEY: fathom1
      REPLICATION_FOLLOWERS: "fathom2@fathom2:9100,fathom3@fathom3:9100,fathom4@fathom4:9100,fathom5@fathom5:9100"
    ports:
      - "18081:8080" # direct Hrana (bypasses the LB; zombie/steal experiments)
      - "18091:8081" # direct health
      - "4001:4000" # admin dashboard

  fathom2:
    <<: *fathom-node
    environment:
      <<: *fathom-env
      S3_ENDPOINT: http://toxiproxy:21002
      NODE_KEY: fathom2
      REPLICATION_FOLLOWERS: "fathom1@fathom1:9100,fathom3@fathom3:9100,fathom4@fathom4:9100,fathom5@fathom5:9100"
    ports:
      - "18082:8080"
      - "18092:8081"
      - "4002:4000" # admin dashboard

  fathom3:
    <<: *fathom-node
    environment:
      <<: *fathom-env
      S3_ENDPOINT: http://toxiproxy:21003
      NODE_KEY: fathom3
      REPLICATION_FOLLOWERS: "fathom1@fathom1:9100,fathom2@fathom2:9100,fathom4@fathom4:9100,fathom5@fathom5:9100"
    ports:
      - "18083:8080"
      - "18093:8081"
      - "4003:4000" # admin dashboard

  # fathom4/fathom5 exist so the fleet can hold a full A2 replica set (1 primary +
  # 4 followers). Ordinary peers in every other respect — each keeps its OWN
  # toxiproxy S3 path (21004/21005), which is what makes `partition <node>` a
  # single-node cut rather than a fleet-wide one.
  fathom4:
    <<: *fathom-node
    environment:
      <<: *fathom-env
      S3_ENDPOINT: http://toxiproxy:21004
      NODE_KEY: fathom4
      REPLICATION_FOLLOWERS: "fathom1@fathom1:9100,fathom2@fathom2:9100,fathom3@fathom3:9100,fathom5@fathom5:9100"
    ports:
      - "18084:8080"
      - "18094:8081"
      - "4004:4000" # admin dashboard

  fathom5:
    <<: *fathom-node
    environment:
      <<: *fathom-env
      S3_ENDPOINT: http://toxiproxy:21005
      NODE_KEY: fathom5
      REPLICATION_FOLLOWERS: "fathom1@fathom1:9100,fathom2@fathom2:9100,fathom3@fathom3:9100,fathom4@fathom4:9100"
    ports:
      - "18085:8080"
      - "18095:8081"
      - "4005:4000" # admin dashboard

  lb:
    image: nginx:1.27-alpine
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./lb-runtime:/etc/nginx/lb:ro
    ports:
      # Overridable because 8080 is a popular port and Docker does NOT fail when it is already
      # taken — it publishes anyway and the earlier listener keeps winning, so every request
      # through the LB reaches whatever is squatting instead of nginx. Measured 2026-08-10: an
      # ssh -L forward held :8080, `curl localhost:8080` returned a bare "Not Found", nginx logged
      # nothing at all, and it read exactly like an application 404. `LB_PORT=18080 ./chaos.sh up`
      # is the escape hatch; `chaos.sh up` now checks for the squat and says so.
      - "${LB_PORT:-8080}:80"
    depends_on:
      - fathom1
      - fathom2
      - fathom3
      - fathom4
      - fathom5

  # Reloader sidecar: reloads nginx whenever the rebalancer rewrites the exception map,
  # so a handoff's LB flip applies with NO host bridge. Shares the lb container's PID
  # namespace (`pid: service:lb`) and sends the nginx master a HUP — no docker socket, no
  # cross-container exec. This is what a deployment provides instead of the app reaching
  # the LB (the alternative being `LB_RELOAD_CMD` where the app *can* reach it).
  lb-reloader:
    image: alpine:3.20
    pid: "service:lb"
    depends_on:
      - lb
    restart: unless-stopped
    volumes:
      - ./lb-runtime:/etc/nginx/lb:ro
    # NB: `$$` escapes compose interpolation so the shell sees a literal `$`.
    command:
      - /bin/sh
      - -c
      - |
        echo "lb-reloader: watching /etc/nginx/lb/exceptions.conf"
        last=""
        while :; do
          cur=$$(stat -c %Y /etc/nginx/lb/exceptions.conf 2>/dev/null)
          if [ -n "$$cur" ] && [ "$$cur" != "$$last" ]; then
            last=$$cur
            master=""
            for c in /proc/[0-9]*/comm; do
              [ "$$(cat "$$c" 2>/dev/null)" = "nginx" ] || continue
              pid=$${c#/proc/}; pid=$${pid%/comm}
              if [ -z "$$master" ] || [ "$$pid" -lt "$$master" ]; then master=$$pid; fi
            done
            if [ -n "$$master" ]; then
              kill -HUP "$$master" 2>/dev/null && echo "lb-reloader: reloaded nginx (master $$master)"
            fi
          fi
          sleep 1
        done

  # One-shot Elixir Hrana load driver (deploy/chaos/tpc_driver.exs). Run IN-NETWORK so it can hold
  # far more concurrent streams than the host port-forwarder allows — one BEAM process per client.
  # Not started by `up` (the `tools` profile keeps it out); build it with `chaos.sh build-driver`
  # and invoke it via `TPC_NET=container ./chaos.sh tpcb|tpc-fleet` (which shells out to
  # `compose run --rm driver <mode> ...`, hitting the LB as http://lb). Entrypoint is the driver, so
  # `compose run driver tpcb --lb http://lb ...` just works.
  driver:
    image: fathom-chaos-driver:latest
    profiles: ["tools"]
    build:
      context: ../../..
      dockerfile: fathom/deploy/chaos/Dockerfile.driver
    # One held socket per client, so driving thousands of concurrent streams needs fd headroom past
    # the default 1024 (same reason the nodes raise it for served density). Without this the driver
    # hits EMFILE around ~1000 clients.
    ulimits:
      nofile:
        soft: 65536
        hard: 524288
