# Fathom — Prometheus alerting rules (review #30).
#
# Encodes the prose alerts from docs/runbooks/cluster.md + operations.md into rules an adopter can
# load as-is, PLUS the page-worthy signals that previously emitted telemetry but weren't exported
# (flush failures, capacity 503s, limiter 429s, heartbeat lapse, Oban stall — now in
# Fathom.Telemetry.metrics/0). Every rule links its runbook section.
#
# Metric names are the exported (underscore) form of Fathom.Telemetry.metrics/0. Thresholds are
# STARTING POINTS — tune the ones marked (TUNE) to your S3 region RTT, node density, and SLOs.
# Validate: promtool check rules alert-rules.yml
#
# Severity convention: page = wake someone; ticket = next-business-day; info = dashboard-only.

groups:
  # ---------------------------------------------------------------------------------------------
  - name: fathom-durability
    rules:
      - alert: FathomCorruptFlushDetected
        # Any occurrence: a local file failed PRAGMA quick_check and was quarantined instead of
        # flushed over the good S3 copy. Not data loss (the good copy stands) but a bad sign.
        expr: increase(fathom_shard_corrupt_flush_count[10m]) > 0
        labels: {severity: page}
        annotations:
          summary: "Corrupt shard detected pre-flush on {{ $labels.node }}"
          description: "A local shard failed quick_check and was quarantined (.corrupt.<ts>); the stored S3 copy stayed authoritative. Investigate the node's disk."
          runbook: docs/runbooks/operations.md#runbook-restore-a-shard-from-s3-disaster-recovery-drill

      - alert: FathomFencedQuarantineChurn
        # Self-fences that quarantined un-flushed writes. A one-off on remap is normal; sustained
        # means ownership is thrashing AND losing acked-but-unflushed writes each time.
        expr: increase(fathom_shard_fenced_quarantine_count[15m]) > 3
        labels: {severity: page}
        annotations:
          summary: "Repeated fenced-quarantine (write-losing self-fences) on {{ $labels.node }}"
          description: "More than 3 self-fences quarantined un-flushed writes in 15m — ownership churn is losing data windows. Check LB stability / clock skew."
          runbook: docs/runbooks/cluster.md#runbook-suspected-double-write--split-brain-on-remap

      - alert: FathomFlushFailing
        # The DIRECT flush-failure signal (#27): flushes are erroring, not just aging. A persistent
        # rate means an S3 auth / bucket-policy / reachability problem turning "RPO = 5s" into
        # "RPO = hours" silently. The coordinator also escalates to Logger.error past
        # :flush_failure_alert_threshold consecutive failures.
        expr: sum by (node) (rate(fathom_shard_flush_failed_count[5m])) > 0
        for: 5m
        labels: {severity: page}
        annotations:
          summary: "Durability flushes failing on {{ $labels.node }}"
          description: "Shard flushes have been erroring for 5m — the RPO is growing and un-flushed writes are at risk if the node is lost. Check S3 reachability, credentials, and bucket policy."
          runbook: docs/runbooks/operations.md#runbook-node-disk-full-shard_data_dir

      - alert: FathomRestoreDrillFailure
        # The automated restore drill (#24) found a durable object that is CORRUPT, of the wrong
        # lineage (schema_version mismatch), or unpullable — a bad "backup" that would otherwise
        # surface only when the (possibly-dormant) tenant returns. The durable object is fathom's
        # only copy, so any occurrence is page-worthy. Only fires once the drill is enabled
        # (:restore_drill_sample); `absent`/`sentinel` (brand-new, no data yet) are excluded.
        expr: sum by (status) (increase(fathom_restore_drill_result_count{status=~"corrupt|schema_mismatch|error"}[1d])) > 0
        for: 5m
        labels: {severity: page}
        annotations:
          summary: "Restore drill found a bad durable object ({{ $labels.status }})"
          description: "The sampled restore drill classified a shard's durable object as {{ $labels.status }} — a cold-tail tenant's only copy is bad or unreachable. Find it via last_verify_status in the directory; recover from a snapshot/version if available (#12) before the tenant returns."
          runbook: docs/runbooks/operations.md#runbook-postgres-directory--control-plane-is-down

      - alert: FathomShardForked
        # The local copy diverged from the stored lineage — a peer advanced the object while this
        # node held writes against the old one. Those writes were ACKED to a client and are now in
        # a .forked.<ts> file, NOT in the tenant's database. The tenant reads consistently and
        # nothing looks wrong to it; only this says data was acked and then set aside. Recovery is
        # manual, so any occurrence pages.
        expr: increase(fathom_shard_forked_count[10m]) > 0
        labels: {severity: page}
        annotations:
          summary: "Shard forked from its stored lineage on {{ $labels.node }}"
          description: "A local shard copy diverged from the stored object and was quarantined to .forked.<ts>; the writes in that file were acked to a client and are not in the tenant's database. Enumerate with `mix fathom.shard quarantines` and decide per shard whether to merge or discard."
          runbook: docs/runbooks/operations.md#runbook-restore-a-shard-from-s3-disaster-recovery-drill

      - alert: FathomRestoreDrillProcedureBroken
        # Distinct from FathomRestoreDrillFailure, which says "this stored object is bad". This
        # says the RECOVERY PATH itself is broken (#48): the fork failed, or it produced a database
        # whose row counts do not match the source. A corrupt object is one tenant; a broken
        # recovery path is every tenant, discovered at the worst possible moment.
        expr: sum by (status) (increase(fathom_restore_drill_full_result_count{status=~"fork_failed|restored_mismatch"}[1d])) > 0
        for: 5m
        labels: {severity: page}
        annotations:
          summary: "Restore PROCEDURE is broken ({{ $labels.status }})"
          description: "The full restore drill could not recover a shard by the documented path — fork_failed means the recovery mechanism is broken, restored_mismatch means it produced a database that is not the source. This is the procedure an operator runs under maximum pressure; fix it before the next incident needs it."
          runbook: docs/runbooks/operations.md#runbook-restore-a-shard-from-s3-disaster-recovery-drill

      - alert: FathomSnapshotSweepFailing
        # The RPO for LOGICAL corruption (a bad deploy, a bad backfill) is the snapshot cadence,
        # not the 5s flush interval — the live object is overwritten every flush, so snapshots are
        # the only thing that answers "restore tenant acme to 09:00". A failing scheduler
        # lengthens that window silently; a failing retention sweep leaves storage growing.
        expr: increase(fathom_snapshots_scheduled_error[2h]) > 0 or increase(fathom_snapshots_retention_errors[2h]) > 0
        for: 10m
        labels: {severity: ticket}
        annotations:
          summary: "Scheduled snapshot / retention sweep is erroring"
          description: "Snapshot creation or GFS retention is failing for some shards. Point-in-time recovery for logical corruption degrades to the last successful snapshot. last_snapshot_at is stamped only on success, so failing shards stay at the head of the rotation — check storage reachability and the :snapshot_retention policy."
          runbook: docs/durability.md

      - alert: FathomUnflushedAgeHigh
        # The RPO exposure gauge. Rising oldest-unflushed age = flushes are failing silently (S3
        # trouble or a stuck coordinator). This is the "flush failure rate" signal the RPO gauge
        # surfaces. (TUNE) to your flush cadence + acceptable RPO — keep these coupled.
        #
        # Threshold is ~2x the PROD :shard_flush_interval_ms (300s, config/runtime.exs). Was 30000
        # (6x the 5s LIBRARY default); left unchanged it would have paged on every ordinary dirty
        # shard, since normal operation now holds writes for a full 300s cadence.
        #
        # The MULTIPLE deliberately dropped 6x -> 2x with the cadence change. The multiple exists
        # to clear normal cadence jitter, and that jitter is a flush's own duration (~6ms), which
        # did NOT grow 60x with the interval. Keeping 6x would mean 1800s + `for: 5m` = 35 minutes
        # of total flush failure before anyone is paged. 2x still sits far above normal and, with
        # the 5m sustain below, cannot fire mid-cadence.
        expr: max by (node) (fathom_durability_oldest_age_ms) > 600000
        for: 5m
        labels: {severity: page}
        annotations:
          summary: "Oldest un-flushed write > 10m on {{ $labels.node }} (RPO exposure rising)"
          description: "A shard has held un-flushed writes beyond the RPO target for 5m — flushes are not landing. If the node is lost now, this window is lost. Check S3 reachability + coordinator health."
          runbook: docs/runbooks/operations.md#runbook-node-disk-full-shard_data_dir

      - alert: FathomManyDirtyShards
        # Informational capacity signal: a large fraction of open shards holding un-flushed writes.
        # Oldest-age bar is ~4x the PROD :shard_flush_interval_ms (300s, config/runtime.exs) — keep
        # coupled with it. Was 60000 (12x the 5s LIBRARY default), which is BELOW one normal 300s
        # cadence and so would have ticketed continuously. Same 6x->2x reasoning as the page above.
        expr: max by (node) (fathom_durability_dirty_shards) > 0 and max by (node) (fathom_durability_oldest_age_ms) > 1200000
        for: 10m
        labels: {severity: ticket}
        annotations:
          summary: "Dirty shards not draining on {{ $labels.node }}"
          description: "Open shards are holding un-flushed writes with the oldest > 20m — periodic flush may be starved. Correlate with S3 op latency."
          runbook: docs/runbooks/cluster.md

  # ---------------------------------------------------------------------------------------------
  - name: fathom-capacity
    rules:
      - alert: FathomAtCapacity503
        # New-shard opens refused at the per-node cap — a tenant is DOWN (its LB home can't admit
        # it). The rebalance / add-capacity signal.
        expr: increase(fathom_shards_at_capacity_count[5m]) > 0
        for: 5m
        labels: {severity: page}
        annotations:
          summary: "Shard opens refused at capacity on {{ $labels.node }} (tenant-down)"
          description: "A node hit :max_open_shards and returned 503 (or evicted idle shards to fit). Add capacity or rebalance; a refused open means that tenant is unavailable."
          runbook: docs/runbooks/operations.md#runbook-node-disk-full-shard_data_dir

      - alert: FathomIdleEvictionChurn
        # Soft-cap LRU idle-eviction running steadily = the node is over its comfortable open-shard
        # count and cold-re-opening evicted shards on next touch (latency tax).
        expr: rate(fathom_shards_evicted_count[5m]) > 0.1
        for: 15m
        labels: {severity: ticket}
        annotations:
          summary: "Sustained idle-shard eviction on {{ $labels.node }}"
          description: "Idle shards are being LRU-evicted to admit new opens for 15m — the node is running near :max_open_shards. Add capacity or raise the cap if fd/RSS allows."
          runbook: docs/runbooks/operations.md#runbook-node-disk-full-shard_data_dir

      - alert: FathomNovelShardRateLimited
        # Novel-shard 429s — new-tenant minting hit the NovelLimiter budget. Could be legitimate
        # signup burst OR abuse (an untrusted data path minting shards).
        expr: increase(fathom_shards_novel_rate_limited_count[10m]) > 0
        for: 5m
        labels: {severity: ticket}
        annotations:
          summary: "Novel-shard creation rate-limited on {{ $labels.node }}"
          description: "New shard ids were refused (429) by the NovelLimiter. If this is a legit signup burst, raise NOVEL_SHARD_RATE; if the data path is untrusted, investigate abuse."
          runbook: docs/runbooks/operations.md#runbook-postgres-directory--control-plane-is-down

  # ---------------------------------------------------------------------------------------------
  - name: fathom-ownership
    rules:
      - alert: FathomCheckoutUnavailable
        # A shard can't be served (unavailable/error outcomes). LB<->lease disagreement, slow
        # cold-open, or a wedged coordinator.
        expr: |
          sum by (node) (rate(fathom_shards_checkout_stop_duration_count{outcome=~"unavailable|error"}[5m])) > 0
        for: 2m
        labels: {severity: page}
        annotations:
          summary: "Shard checkouts failing (unavailable/error) on {{ $labels.node }}"
          description: "Checkouts are returning unavailable/error for 2m. Check LB<->lease agreement, cold-open latency, and coordinator health."
          runbook: docs/runbooks/cluster.md#runbook-a-shard-is-stuck-unavailable

      - alert: FathomSelfFenceChurn
        # Sustained self-fences = suspected split-brain / ownership thrash (the fence HELD, so data
        # is safe — this is availability/churn). One-off on remap is normal.
        expr: sum(rate(fathom_shard_lease_superseded_count[5m])) > 0
        for: 5m
        labels: {severity: page}
        annotations:
          summary: "Sustained lease self-fences fleet-wide (suspected split-brain / churn)"
          description: "The {owner,epoch} fence keeps stopping losers — data is safe, but ownership is thrashing. Check for two LBs / stale config, flapping health checks, or clock skew (NTP)."
          runbook: docs/runbooks/operations.md#runbook-dual-lb--stale-lb-config-double-routing

      - alert: FathomWritesFenced
        # The consequence of a lapse that FathomHeartbeatLapse only warns is coming. Past the steal
        # margin the coordinator stops acking writes (:fence_writes_when_stealable, ON in prod) so
        # the loss window collapses from the whole partition to ~ttl+margin. Correct, and a
        # tenant-visible WRITE OUTAGE while it lasts — reads keep serving from the local copy, so
        # the tenant sees a half-working database and no other signal moves.
        expr: increase(fathom_shard_write_fenced_count[10m]) > 0
        labels: {severity: page}
        annotations:
          summary: "Writes fenced on {{ $labels.node }} — shards are read-only until the lease is renewed"
          description: "This node's heartbeat went stale past the steal margin, so it stopped acking writes to protect against a split-brain double-write. Reads still serve. Restore S3 reachability (or let the shard move) — the fence clears when the lease is valid again."
          runbook: docs/runbooks/operations.md#runbook-heartbeat-object-lost-or-deleted

      - alert: FathomHeartbeatLapse
        # A node heartbeat lapsed — its shards become stealable. The mass-self-fence precursor.
        expr: increase(fathom_shard_heartbeat_lapsed_count[10m]) > 0
        for: 5m
        labels: {severity: page}
        annotations:
          summary: "Node heartbeat lapsed on {{ $labels.node }} (shards became stealable)"
          description: "A heartbeat renewal didn't land within the TTL margin. If the node is healthy, suspect S3 reachability or a node_key collision / deleted heartbeat object."
          runbook: docs/runbooks/operations.md#runbook-heartbeat-object-lost-or-deleted

      - alert: FathomColdOpenSlow
        # Cold-open (S3 pull) p99 above the failover SLO. (TUNE) against your S3 region RTT
        # (~2x one-way + a few ms is expected — see docs/benchmark-plan.md).
        expr: |
          histogram_quantile(0.99, sum by (le, node) (rate(fathom_shard_cold_open_duration_bucket{warm="false"}[5m]))) > 1000
        for: 10m
        labels: {severity: ticket}
        annotations:
          summary: "Cold-open p99 > 1s on {{ $labels.node }}"
          description: "S3-pull cold-open p99 exceeds the failover SLO. Check S3 latency / region; consider the warm-standby follower for faster failover."
          runbook: docs/runbooks/cluster.md#runbook-a-shard-is-stuck-unavailable

      - alert: FathomLeaseStoreDown
        # S3 (the lease store) down = the cluster-wide SPOF. Checkout errors spike fleet-wide.
        expr: |
          (count(sum by (node) (rate(fathom_shards_checkout_stop_duration_count{outcome="error"}[5m])) > 0)) >= 2
        for: 3m
        labels: {severity: page}
        annotations:
          summary: "Checkout errors on multiple nodes — suspected lease store (S3) outage"
          description: "Checkout 'error' outcomes on >=2 nodes for 3m. This is the fleet-wide SPOF; the lease fails CLOSED (won't open/renew). Escalate to the object store; do NOT bypass the fence."
          runbook: docs/runbooks/cluster.md#runbook-lease-store-s3-is-down

  # ---------------------------------------------------------------------------------------------
  - name: fathom-control-plane
    rules:
      - alert: FathomTenantBornEmpty
        # A novel tenant was minted while :fork_from_template was ON, but the fork FAILED, so the
        # tenant is serving with NO SCHEMA. It cannot self-heal: every ORM query fails, and the
        # rollout can't rescue it either (`django_migrations` is created by Django's recorder in
        # autocommit, so it belongs to no captured version — replaying v1 onto an empty file dies
        # on `no such table: django_migrations`). That is deliberate: a born-empty tenant is a
        # FAILED BIRTH, not a state the rollout should quietly heal.
        #
        # So this is a HARD OUTAGE for one tenant that produces no 5xx rate anywhere — the checkout
        # deliberately succeeds. Nothing else will ever tell you. Any occurrence pages, and the
        # remedy is manual: find the shard_id in the node's logs, delete the tenant, re-mint it once
        # the fork works. `reason=no_template_snapshot` is the common one and means the prerequisite
        # never ran — release a version, then `mix fathom.snapshot template-head`.
        expr: sum by (reason) (increase(fathom_migrator_fork_fallback_count[1h])) > 0
        labels: {severity: page}
        annotations:
          summary: "Tenant born with NO schema — fork-from-template failed ({{ $labels.reason }})"
          description: "A novel tenant was born empty because the template fork failed; it is serving and every ORM query against it fails, and the rollout cannot heal it. Grep the node for 'born EMPTY' to get the shard_id, then delete and re-mint that tenant. If reason=no_template_snapshot, run `mix fathom.snapshot template-head` after releasing a version."
          runbook: docs/runbooks/operations.md#runbook-a-tenant-was-born-with-no-schema-fork-fallback

      - alert: FathomMigrationStalled
        # The 2026-08-04 finding, made visible. A per-shard migration that cannot proceed snoozes
        # forever — correct, since "busy" and "lease-held" both clear on their own — but it did so
        # with an EMPTY errors array, failed: 0, no quarantine and nothing above [info]. The tenant
        # serves normally and can never migrate, so the deploy gate never converges and
        # `eta_seconds` reports a small confident number that never arrives.
        expr: increase(fathom_migrator_migration_stalled_count[1h]) > 0
        for: 15m
        labels: {severity: ticket}
        annotations:
          summary: "A per-shard migration has been snoozing past the stall threshold"
          description: "One or more shards cannot migrate and are retrying indefinitely. Read `stalled` in /api/migrations/status — while it is non-zero, eta_seconds is fiction. Grep the node for the shard_id; a lease held by a coordinator that no longer exists is the known cause and a client touch on the owning node clears it."
          runbook: docs/runbooks/operations.md#runbook-postgres-directory--control-plane-is-down

      - alert: FathomMigrationGap
        # The fleet is missing DDL. Capture cannot see an `atomic = False` migration by
        # construction (autocommit, no transaction to hook), so the template silently moves ahead
        # and this version — and everything above it — assumes schema the fleet never received.
        # `mix fathom.check_migrations` is the pre-flight gate; this firing means it was skipped.
        expr: increase(fathom_migrator_migration_gap_count[1d]) > 0
        labels: {severity: ticket}
        annotations:
          summary: "Template/fleet migration gap — the fleet is missing DDL"
          description: "A capture began with a higher django_migrations count than the last one recorded, so migrations ran outside capture (typically `atomic = False`). HEAD is frozen below that version. Reconcile the template against the fleet before approving anything; a transform cannot conjure DDL that was missed."
          runbook: docs/django-migrations.md

      - alert: FathomTemplateDrift
        # A revert moved the fleet pointer back but the template still carries the yanked version,
        # so the next `makemigrations` builds on DDL the fleet does not have. Discovered otherwise
        # at the next fleet-wide migration, which is the worst time to find out.
        expr: increase(fathom_migrator_template_drift_count[1d]) > 0
        labels: {severity: ticket}
        annotations:
          summary: "Capture template drifted from the fleet after a revert"
          description: "The template still has a version the fleet reverted away from. Bring the template back in line (or re-release) before the next makemigrations, which would otherwise build on DDL the fleet never received."
          runbook: docs/django-migrations.md

      - alert: FathomRevocationFloorStale
        # Token revocation degrades OPEN by design: a floor read that fails serves the last-known
        # good value rather than failing every request. Correct, and it means a revoke issued after
        # that value was cached is NOT being enforced on this node. Silent by construction — the
        # tokens keep working, which is exactly what a working system looks like.
        expr: sum by (node) (increase(fathom_hrana_revocation_floor_error_count[15m])) > 0
        for: 10m
        labels: {severity: ticket}
        annotations:
          summary: "Revocation floors are stale on {{ $labels.node }} — revoked tokens may still work"
          description: "Floor reads are failing and the node is serving cached values, so tokens revoked since then are still accepted there. Check Postgres reachability from this node. If a revocation was security-driven, treat it as not yet effective fleet-wide until this clears."
          runbook: docs/auth.md

      - alert: FathomObanJobFailures
        # Oban failures = a stalling control plane (migrations, reconcile, rebalancer, retirement,
        # tenant delete/suspend). Often a Postgres incident.
        expr: sum by (queue) (rate(fathom_oban_job_exception_count[10m])) > 0
        for: 10m
        labels: {severity: ticket}
        annotations:
          summary: "Oban job failures in queue {{ $labels.queue }}"
          description: "Background jobs are failing for 10m — the control plane may be stalling. Check Postgres health and the queue's worker logs."
          runbook: docs/runbooks/operations.md#runbook-postgres-directory--control-plane-is-down

      - alert: FathomObanQueueBacklog
        # The OTHER half of a stalling control plane (#18): jobs that DON'T RUN. The exception
        # counter above stays flat when a queue is paused, or the backlog outpaces the concurrency
        # limit — but the oldest runnable job just ages. > 10m unpicked for 10m is a real backlog
        # (a per-shard migration is quick; nothing should sit available this long). (TUNE) per queue.
        expr: max by (queue) (fathom_oban_queue_oldest_age_ms) > 600000
        for: 10m
        labels: {severity: ticket}
        annotations:
          summary: "Oban queue {{ $labels.queue }} is backlogged (oldest job > 10m unpicked)"
          description: "A runnable job has sat in queue {{ $labels.queue }} for over 10m — the queue is paused or not draining, and NO exceptions are firing. Check `Oban` peer/queue state and Postgres."
          runbook: docs/runbooks/operations.md#runbook-postgres-directory--control-plane-is-down

      - alert: FathomRebalanceCronStalled
        # A fleet-singleton cron that silently STOPPED (wedged Oban peer leadership) inserts no jobs
        # and throws no exceptions. RebalanceJob runs every minute; > 2x its period means the leader
        # isn't inserting. Only meaningful once rebalancing is enabled (the job is inert but still
        # inserts+completes each minute), so pair with :rebalancer_enabled. (TUNE) to the schedule.
        expr: max(fathom_oban_cron_age_ms{worker="Fathom.Rebalancer.RebalanceJob"}) > 120000
        for: 10m
        labels: {severity: ticket}
        annotations:
          summary: "The rebalance cron hasn't inserted a job in > 2 minutes"
          description: "RebalanceJob (every-minute fleet singleton) last inserted a job over 2m ago on every node — Oban peer leadership may be wedged, silently halting rebalance/reconcile/retirement. Check `Oban.Peer` leadership and Postgres."
          runbook: docs/runbooks/operations.md#runbook-postgres-directory--control-plane-is-down

      - alert: FathomReconcileCronStalled
        # ReconcileJob is the hourly sweep that converges the cold migration tail; if its cron
        # wedges, a schema rollout silently stops converging. > 2x the hourly period.
        expr: max(fathom_oban_cron_age_ms{worker="Fathom.Migrator.ReconcileJob"}) > 7200000
        for: 15m
        labels: {severity: ticket}
        annotations:
          summary: "The reconcile cron hasn't inserted a job in > 2 hours"
          description: "ReconcileJob (hourly fleet singleton) last inserted a job over 2h ago — the migration cold tail has stopped converging with zero exceptions. Check `Oban.Peer` leadership and Postgres."
          runbook: docs/runbooks/operations.md#runbook-postgres-directory--control-plane-is-down

  # ---------------------------------------------------------------------------------------------
  # Rebalancer alerts (only meaningful once B1 is enabled — see docs/runbooks/rebalancer.md).
  - name: fathom-rebalancer
    rules:
      - alert: FathomHandoffReverts
        expr: sum(rate(fathom_rebalancer_handoff_stop_count{outcome="reverted"}[15m])) > 0
        for: 15m
        labels: {severity: ticket}
        annotations:
          summary: "Rebalancer handoffs are reverting"
          description: "Handoffs are failing to drain and reverting — a shard may be wedged. Pair with handoff.retry rising."
          runbook: docs/runbooks/rebalancer.md

      - alert: FathomLbApplyFailed
        # The rendered LB map couldn't be applied — routing is at risk (the running LB may be stale
        # and the next nginx cold start could fail).
        expr: |
          increase(fathom_rebalancer_lb_apply_count{outcome=~"reload_failed|config_test_failed|write_failed"}[10m]) > 0
        labels: {severity: page}
        annotations:
          summary: "Rebalancer LB-map apply failed on {{ $labels.node }} (routing at risk)"
          description: "The exception map couldn't be written/tested/reloaded. Investigate immediately — routing may be stale."
          runbook: docs/runbooks/rebalancer.md

  # ---------------------------------------------------------------------------------------------
  # Local disk (expert review 2026-08-01 #36). These matter more than an ordinary capacity alert:
  # when the volume fills, every cold-open `pull` AND every dirty shard's `VACUUM INTO` fails, so
  # writes keep being ACKED and can never be made durable — the RPO contract goes unbounded. The
  # symptoms that surface (flush.failed climbing, durability.oldest_age_ms growing) are identical
  # to an S3 credential/reachability problem, so without these the diagnosis points the wrong way.
  - name: fathom-disk
    rules:
      - alert: FathomDiskFillingUp
        expr: fathom_node_disk_used_ratio > 0.85
        for: 10m
        labels: {severity: ticket}
        annotations:
          summary: "Disk {{ $labels.dir }} on {{ $labels.node }} is {{ $value | humanizePercentage }} full"
          description: "The volume holding fathom's {{ $labels.dir }} directory is filling. At 100% every cold-open pull and every VACUUM INTO fails while writes keep being acked — durability stops silently. With the warm follower on, `:warm_cache_max` bounds the cache in shard COUNT, not bytes; consider :warm_cache_max_bytes / :warm_disk_free_floor_bytes."
          runbook: docs/runbooks/operations.md#runbook-node-disk-full-shard_data_dir

      - alert: FathomDiskCritical
        expr: fathom_node_disk_used_ratio > 0.95
        for: 2m
        labels: {severity: page}
        annotations:
          summary: "Disk {{ $labels.dir }} on {{ $labels.node }} is critically full ({{ $value | humanizePercentage }})"
          description: "Durability is about to stop on this node: pulls and VACUUM INTO will fail while writes are still acked. Free space or drain the node NOW."
          runbook: docs/runbooks/operations.md#runbook-node-disk-full-shard_data_dir

      - alert: FathomReplicationNoQuorumSlack
        # Phase 2 A2. Connected followers == the write quorum exactly: every commit still
        # succeeds, and losing one more follower fails every write on this node with
        # 503 FILO_NO_QUORUM. Deliberately a page rather than a ticket, because the state has no
        # other symptom — latency is normal, no error rate moves, and nothing degrades until it
        # all does at once. Inert unless REPLICATION_ENABLED (the gauge is not emitted otherwise).
        expr: fathom_replication_followers_slack == 0
        for: 5m
        labels: {severity: page}
        annotations:
          summary: "Replication on {{ $labels.node }} has zero quorum slack"
          description: "Connected followers equals :replication_quorum. Writes succeed now; one more follower loss fails all of them. Check fathom_replication_followers_connected against _configured and bring the missing follower back before anything else."
          runbook: docs/a2-quorum-replication.md

      - alert: FathomReplicationWritesFailing
        # Slack is negative: fewer followers connected than the quorum needs, so commits are
        # already returning 503 FILO_NO_QUORUM. The write is durable locally and will reach S3 on
        # the next flush — the tenant is being told the truth, that it did not get the
        # quorum-durable write it asked for.
        expr: fathom_replication_followers_slack < 0
        for: 1m
        labels: {severity: page}
        annotations:
          summary: "Replication quorum unreachable on {{ $labels.node }} — writes failing"
          description: "Fewer followers connected than :replication_quorum, so tenant commits are failing with FILO_NO_QUORUM. Writes that did land are durable locally and reach S3 on the next flush; the RPO~0 guarantee is what is lost."
          runbook: docs/a2-quorum-replication.md

      # A2 SATURATION. The thresholds are picked from a measured sweep rather than from taste:
      # 512 -> 1024 -> 2048 tenants gave 3,340 -> 2,776 -> 258 txn/s, so the last doubling is a
      # 10.8x COLLAPSE, not a slope. Throughput looks healthy right up to it, which is exactly why
      # the alert is on budget utilisation and not on tps.
      # docs/reviews/a2-flush-interval-2026-08-18.md
      - alert: FathomReplicationBudgetHigh
        # Leading indicator: the byte budget is filling but nothing is being refused yet.
        expr: fathom_replication_budget_used_ratio > 0.5
        for: 10m
        labels: {severity: ticket}
        annotations:
          summary: "Replication byte budget on {{ $labels.node }} is {{ $value | humanizePercentage }} full"
          description: "This node's shippers are holding a growing share of :replication_max_queue_bytes. Nothing is failing yet — this is the warning throughput does not give, because A2 falls off a cliff rather than degrading. Shed tenants from this node, or raise the bound only after checking the link is not simply saturated."
          runbook: docs/runbooks/cluster.md

      - alert: FathomReplicationOverloaded
        # Lagging confirmation: the budget is now REFUSING pushes, so tenant writes are failing
        # FILO_NO_QUORUM on this node. `already_in_flight` is deliberately NOT alerted on — it is
        # the top reject by count and measured harmless (unchanged across a same-image A/B whose
        # good arm had 4 errors), so alerting on it would page for normal straggler traffic.
        expr: increase(fathom_replication_reject_count{reason="overloaded"}[5m]) > 0
        for: 5m
        labels: {severity: page}
        annotations:
          summary: "Replication on {{ $labels.node }} is refusing pushes (byte budget)"
          description: "The per-node replication byte budget is full and pushes are being rejected, so commits are failing their quorum and tenants are seeing 503 FILO_NO_QUORUM. The budget refuses EVERY push once over cap, including small ones for healthy shards, so one saturated node can become a node-wide write outage — see the known limitation in tasks/todo.md."
          runbook: docs/runbooks/cluster.md

      - alert: FathomWarmCacheDiskPressure
        # The follower declined to warm new shards because the volume is below the free floor.
        # Not itself an outage — failover readiness is degrading, and the disk is the cause.
        expr: increase(fathom_warm_follower_disk_pressure_declined[15m]) > 0
        for: 15m
        labels: {severity: ticket}
        annotations:
          summary: "Warm follower on {{ $labels.node }} is refusing new shards (disk floor)"
          description: "Free space is below :warm_disk_free_floor_bytes, so the standby cache has stopped taking on shards. Already-cached shards are retained; failover for everything else falls back to a full cold pull."
          runbook: docs/runbooks/operations.md#runbook-node-disk-full-shard_data_dir

