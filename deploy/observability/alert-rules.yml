# Fathom — Prometheus alerting rules (review #30).
#
# Encodes the prose alerts from docs/runbooks/cluster.md + operations.md into rules an adopter can
# load as-is, PLUS the page-worthy signals that previously emitted telemetry but weren't exported
# (flush failures, capacity 503s, limiter 429s, heartbeat lapse, Oban stall — now in
# Fathom.Telemetry.metrics/0). Every rule links its runbook section.
#
# Metric names are the exported (underscore) form of Fathom.Telemetry.metrics/0. Thresholds are
# STARTING POINTS — tune the ones marked (TUNE) to your S3 region RTT, node density, and SLOs.
# Validate: promtool check rules alert-rules.yml
#
# Severity convention: page = wake someone; ticket = next-business-day; info = dashboard-only.

groups:
  # ---------------------------------------------------------------------------------------------
  - name: fathom-durability
    rules:
      - alert: FathomCorruptFlushDetected
        # Any occurrence: a local file failed PRAGMA quick_check and was quarantined instead of
        # flushed over the good S3 copy. Not data loss (the good copy stands) but a bad sign.
        expr: increase(fathom_shard_corrupt_flush_count[10m]) > 0
        labels: {severity: page}
        annotations:
          summary: "Corrupt shard detected pre-flush on {{ $labels.node }}"
          description: "A local shard failed quick_check and was quarantined (.corrupt.<ts>); the stored S3 copy stayed authoritative. Investigate the node's disk."
          runbook: docs/runbooks/operations.md#runbook-restore-a-shard-from-s3-disaster-recovery-drill

      - alert: FathomFencedQuarantineChurn
        # Self-fences that quarantined un-flushed writes. A one-off on remap is normal; sustained
        # means ownership is thrashing AND losing acked-but-unflushed writes each time.
        expr: increase(fathom_shard_fenced_quarantine_count[15m]) > 3
        labels: {severity: page}
        annotations:
          summary: "Repeated fenced-quarantine (write-losing self-fences) on {{ $labels.node }}"
          description: "More than 3 self-fences quarantined un-flushed writes in 15m — ownership churn is losing data windows. Check LB stability / clock skew."
          runbook: docs/runbooks/cluster.md#runbook-suspected-double-write--split-brain-on-remap

      - alert: FathomFlushFailing
        # The DIRECT flush-failure signal (#27): flushes are erroring, not just aging. A persistent
        # rate means an S3 auth / bucket-policy / reachability problem turning "RPO = 30s" into
        # "RPO = hours" silently. The coordinator also escalates to Logger.error past
        # :flush_failure_alert_threshold consecutive failures.
        expr: sum by (node) (rate(fathom_shard_flush_failed_count[5m])) > 0
        for: 5m
        labels: {severity: page}
        annotations:
          summary: "Durability flushes failing on {{ $labels.node }}"
          description: "Shard flushes have been erroring for 5m — the RPO is growing and un-flushed writes are at risk if the node is lost. Check S3 reachability, credentials, and bucket policy."
          runbook: docs/runbooks/operations.md#runbook-node-disk-full-shard_data_dir

      - alert: FathomUnflushedAgeHigh
        # The RPO exposure gauge. Rising oldest-unflushed age = flushes are failing silently (S3
        # trouble or a stuck coordinator). This is the "flush failure rate" signal the RPO gauge
        # surfaces. (TUNE) to your flush cadence + acceptable RPO.
        expr: max by (node) (fathom_durability_oldest_age_ms) > 120000
        for: 5m
        labels: {severity: page}
        annotations:
          summary: "Oldest un-flushed write > 2m on {{ $labels.node }} (RPO exposure rising)"
          description: "A shard has held un-flushed writes beyond the RPO target for 5m — flushes are not landing. If the node is lost now, this window is lost. Check S3 reachability + coordinator health."
          runbook: docs/runbooks/operations.md#runbook-node-disk-full-shard_data_dir

      - alert: FathomManyDirtyShards
        # Informational capacity signal: a large fraction of open shards holding un-flushed writes.
        expr: max by (node) (fathom_durability_dirty_shards) > 0 and max by (node) (fathom_durability_oldest_age_ms) > 300000
        for: 10m
        labels: {severity: ticket}
        annotations:
          summary: "Dirty shards not draining on {{ $labels.node }}"
          description: "Open shards are holding un-flushed writes with the oldest > 5m — periodic flush may be starved. Correlate with S3 op latency."
          runbook: docs/runbooks/cluster.md

  # ---------------------------------------------------------------------------------------------
  - name: fathom-capacity
    rules:
      - alert: FathomAtCapacity503
        # New-shard opens refused at the per-node cap — a tenant is DOWN (its LB home can't admit
        # it). The rebalance / add-capacity signal.
        expr: increase(fathom_shards_at_capacity_count[5m]) > 0
        for: 5m
        labels: {severity: page}
        annotations:
          summary: "Shard opens refused at capacity on {{ $labels.node }} (tenant-down)"
          description: "A node hit :max_open_shards and returned 503 (or evicted idle shards to fit). Add capacity or rebalance; a refused open means that tenant is unavailable."
          runbook: docs/runbooks/operations.md#runbook-node-disk-full-shard_data_dir

      - alert: FathomIdleEvictionChurn
        # Soft-cap LRU idle-eviction running steadily = the node is over its comfortable open-shard
        # count and cold-re-opening evicted shards on next touch (latency tax).
        expr: rate(fathom_shards_evicted_count[5m]) > 0.1
        for: 15m
        labels: {severity: ticket}
        annotations:
          summary: "Sustained idle-shard eviction on {{ $labels.node }}"
          description: "Idle shards are being LRU-evicted to admit new opens for 15m — the node is running near :max_open_shards. Add capacity or raise the cap if fd/RSS allows."
          runbook: docs/runbooks/operations.md#runbook-node-disk-full-shard_data_dir

      - alert: FathomNovelShardRateLimited
        # Novel-shard 429s — new-tenant minting hit the NovelLimiter budget. Could be legitimate
        # signup burst OR abuse (an untrusted data path minting shards).
        expr: increase(fathom_shards_novel_rate_limited_count[10m]) > 0
        for: 5m
        labels: {severity: ticket}
        annotations:
          summary: "Novel-shard creation rate-limited on {{ $labels.node }}"
          description: "New shard ids were refused (429) by the NovelLimiter. If this is a legit signup burst, raise NOVEL_SHARD_RATE; if the data path is untrusted, investigate abuse."
          runbook: docs/runbooks/operations.md#runbook-postgres-directory--control-plane-is-down

  # ---------------------------------------------------------------------------------------------
  - name: fathom-ownership
    rules:
      - alert: FathomCheckoutUnavailable
        # A shard can't be served (unavailable/error outcomes). LB<->lease disagreement, slow
        # cold-open, or a wedged coordinator.
        expr: |
          sum by (node) (rate(fathom_shards_checkout_stop_duration_count{outcome=~"unavailable|error"}[5m])) > 0
        for: 2m
        labels: {severity: page}
        annotations:
          summary: "Shard checkouts failing (unavailable/error) on {{ $labels.node }}"
          description: "Checkouts are returning unavailable/error for 2m. Check LB<->lease agreement, cold-open latency, and coordinator health."
          runbook: docs/runbooks/cluster.md#runbook-a-shard-is-stuck-unavailable

      - alert: FathomSelfFenceChurn
        # Sustained self-fences = suspected split-brain / ownership thrash (the fence HELD, so data
        # is safe — this is availability/churn). One-off on remap is normal.
        expr: sum(rate(fathom_shard_lease_superseded_count[5m])) > 0
        for: 5m
        labels: {severity: page}
        annotations:
          summary: "Sustained lease self-fences fleet-wide (suspected split-brain / churn)"
          description: "The {owner,epoch} fence keeps stopping losers — data is safe, but ownership is thrashing. Check for two LBs / stale config, flapping health checks, or clock skew (NTP)."
          runbook: docs/runbooks/operations.md#runbook-dual-lb--stale-lb-config-double-routing

      - alert: FathomHeartbeatLapse
        # A node heartbeat lapsed — its shards become stealable. The mass-self-fence precursor.
        expr: increase(fathom_shard_heartbeat_lapsed_count[10m]) > 0
        for: 5m
        labels: {severity: page}
        annotations:
          summary: "Node heartbeat lapsed on {{ $labels.node }} (shards became stealable)"
          description: "A heartbeat renewal didn't land within the TTL margin. If the node is healthy, suspect S3 reachability or a node_key collision / deleted heartbeat object."
          runbook: docs/runbooks/operations.md#runbook-heartbeat-object-lost-or-deleted

      - alert: FathomColdOpenSlow
        # Cold-open (S3 pull) p99 above the failover SLO. (TUNE) against your S3 region RTT
        # (~2x one-way + a few ms is expected — see docs/benchmark-plan.md).
        expr: |
          histogram_quantile(0.99, sum by (le, node) (rate(fathom_shard_cold_open_duration_bucket{warm="false"}[5m]))) > 1000
        for: 10m
        labels: {severity: ticket}
        annotations:
          summary: "Cold-open p99 > 1s on {{ $labels.node }}"
          description: "S3-pull cold-open p99 exceeds the failover SLO. Check S3 latency / region; consider the warm-standby follower for faster failover."
          runbook: docs/runbooks/cluster.md#runbook-a-shard-is-stuck-unavailable

      - alert: FathomLeaseStoreDown
        # S3 (the lease store) down = the cluster-wide SPOF. Checkout errors spike fleet-wide.
        expr: |
          (count(sum by (node) (rate(fathom_shards_checkout_stop_duration_count{outcome="error"}[5m])) > 0)) >= 2
        for: 3m
        labels: {severity: page}
        annotations:
          summary: "Checkout errors on multiple nodes — suspected lease store (S3) outage"
          description: "Checkout 'error' outcomes on >=2 nodes for 3m. This is the fleet-wide SPOF; the lease fails CLOSED (won't open/renew). Escalate to the object store; do NOT bypass the fence."
          runbook: docs/runbooks/cluster.md#runbook-lease-store-s3-is-down

  # ---------------------------------------------------------------------------------------------
  - name: fathom-control-plane
    rules:
      - alert: FathomObanJobFailures
        # Oban failures = a stalling control plane (migrations, reconcile, rebalancer, retirement,
        # tenant delete/suspend). Often a Postgres incident.
        expr: sum by (queue) (rate(fathom_oban_job_exception_count[10m])) > 0
        for: 10m
        labels: {severity: ticket}
        annotations:
          summary: "Oban job failures in queue {{ $labels.queue }}"
          description: "Background jobs are failing for 10m — the control plane may be stalling. Check Postgres health and the queue's worker logs."
          runbook: docs/runbooks/operations.md#runbook-postgres-directory--control-plane-is-down

  # ---------------------------------------------------------------------------------------------
  # Rebalancer alerts (only meaningful once B1 is enabled — see docs/runbooks/rebalancer.md).
  - name: fathom-rebalancer
    rules:
      - alert: FathomHandoffReverts
        expr: sum(rate(fathom_rebalancer_handoff_stop_count{outcome="reverted"}[15m])) > 0
        for: 15m
        labels: {severity: ticket}
        annotations:
          summary: "Rebalancer handoffs are reverting"
          description: "Handoffs are failing to drain and reverting — a shard may be wedged. Pair with handoff.retry rising."
          runbook: docs/runbooks/rebalancer.md

      - alert: FathomLbApplyFailed
        # The rendered LB map couldn't be applied — routing is at risk (the running LB may be stale
        # and the next nginx cold start could fail).
        expr: |
          increase(fathom_rebalancer_lb_apply_count{outcome=~"reload_failed|config_test_failed|write_failed"}[10m]) > 0
        labels: {severity: page}
        annotations:
          summary: "Rebalancer LB-map apply failed on {{ $labels.node }} (routing at risk)"
          description: "The exception map couldn't be written/tested/reloaded. Investigate immediately — routing may be stale."
          runbook: docs/runbooks/rebalancer.md
