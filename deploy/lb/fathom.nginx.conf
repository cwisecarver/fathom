# Fathom multi-node load balancer — subdomain-keyspace partition (cluster phase, S2).
#
# WHAT THIS DOES
#   Fathom runs as N independent single-node instances. This L7 LB consistent-hashes
#   the request Host (e.g. acme.fathom.example) to ONE backend node, so every request
#   and WebSocket for a given subdomain lands on the same node — that node owns and
#   serves the shard. The S3 lease (built into fathom) is the safety fence: on a node
#   death or a scale change the LB reroutes the subdomain, and the new node steals the
#   lease once the old one lapses (the old node self-fences). The LB does PLACEMENT;
#   the lease does SAFETY. There is no inter-node BEAM cluster — nodes coordinate only
#   through S3.
#
# VALIDATED BY the S1 spike (2026-06-30): `hash $host consistent` gives a deterministic
# subdomain->node map, routes HTTP and WebSocket identically (the upstream is chosen by
# $host before the WS upgrade), moves only ~1/N keys when a node is added (no migration
# stampede), and fails over in-request to a survivor on a node death.
#
# Tune the marked values for your deployment. Swap nginx for HAProxy (`balance hash`)
# or Fly `fly-replay` — the mechanism (hash-on-Host + health failover + consistent
# hashing) is the same.

worker_processes auto;

events { worker_connections 4096; }

http {
  # WebSocket upgrade plumbing: django-libsql connects over WS; libsql HTTP SDKs use HTTP.
  map $http_upgrade $connection_upgrade { default upgrade; '' close; }

  # ---- the partition ----------------------------------------------------------------
  # `consistent` = ketama ring: adding/removing a node remaps only ~1/N subdomains
  # (NOT a naive `mod N` that would remap nearly all of them and stampede S3 cold-opens).
  #
  # Passive health (deployable today, no app changes): a node that refuses a connection
  # or errors is marked down for `fail_timeout` and traffic reroutes. `proxy_next_upstream`
  # retries the SAME request on a healthy node, so the client sees no error on a node death.
  #
  # ACTIVE HEALTH (recommended, see docs/deploy-cluster.md): fathom now exposes a liveness
  # endpoint — GET /health -> 200 on each node's health port (default :8081, separate from
  # the :8080 Hrana port). nginx Plus: `health_check uri=/health port=8081;`. HAProxy:
  # `option httpchk GET /health` + `server ... check port 8081`. Open-source nginx has no
  # active HTTP health check, so the passive config below is the OSS-nginx baseline.
  upstream fathom_hrana {
    hash $host consistent;

    # One line per fathom node (Hrana listener, default :8080). Edit for your fleet.
    server 10.0.0.11:8080 max_fails=2 fail_timeout=10s;
    server 10.0.0.12:8080 max_fails=2 fail_timeout=10s;
    server 10.0.0.13:8080 max_fails=2 fail_timeout=10s;
    # ROLLBACK: comment out all but ONE server line and `nginx -s reload` to collapse the
    # whole fleet onto a single node (the pre-cluster single-node topology). No redeploy.

    keepalive 64;   # reuse upstream connections; helps the per-stream HTTP path
  }

  server {
    # TLS terminates here; fathom speaks plain HTTP on :8080 behind the LB. Tenant data
    # rides standard client->LB->node TLS — it never crosses a BEAM mesh.
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name *.fathom.example;            # EDIT to your wildcard domain
    # ssl_certificate     /etc/ssl/fathom/fullchain.pem;   # EDIT
    # ssl_certificate_key /etc/ssl/fathom/privkey.pem;     # EDIT

    location / {
      proxy_pass http://fathom_hrana;

      # CRITICAL: fathom extracts the shard from the Host subdomain
      # (ShardExecutor.shard_from_conn: acme.fathom.example -> "acme"). The Host header
      # MUST be preserved end to end, AND it is the hash key — do not rewrite it.
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;

      # WebSocket support (django-libsql)
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;

      # Long-lived Hrana WS streams: don't time out an idle-but-open connection.
      proxy_read_timeout  3600s;
      proxy_send_timeout  3600s;
      proxy_connect_timeout 2s;

      # In-request failover on a node death (the S1-proven path). The new node will
      # cold-open the shard from S3 and steal the lease.
      proxy_next_upstream error timeout http_502 http_503 http_504;
      proxy_next_upstream_tries 3;
    }
  }

  # Optional plain-HTTP -> HTTPS redirect.
  server {
    listen 80;
    listen [::]:80;
    server_name *.fathom.example;            # EDIT
    return 301 https://$host$request_uri;
  }
}
